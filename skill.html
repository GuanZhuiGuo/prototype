          state.detailMode = 'edit';
          toast(message);
        }
      } else if (action === 'copyVersion') {
        state.versionAction = 'copy';
        state.versionSource = target.dataset.version;
        state.modal = 'versionSave';
      } else if (action === 'requestRollbackToVersion') {
        state.rollbackTargetVersion = target.dataset.version;
        state.modal = 'rollbackConfirm';
      } else if (action === 'confirmRollbackToVersion') {
        const ok = rollbackToVersion(skill, state.rollbackTargetVersion);
        if (ok) {
          state.modal = null;
          state.rollbackTargetVersion = null;
          state.editTab = 'edit';
          state.detailMode = 'edit';
          toast(`已回退到 ${skill.version}，该版本之后的历史记录已清除。`);
        }
      } else if (action === 'generateOptimize') {
        if (isOfficial(skill)) {
          toast('官方 Skill 不能直接优化。');
          return;
        }
        if (!(skill.records || []).length) {
          toast('暂无调用记录，无法生成优化建议。');
          return;
        }
        state.optimizeDraft = null;
        state.modal = 'optimize';
      } else if (action === 'executeOptimize') {
        const records = [...(skill.records || [])].sort((a, b) => String(b.time).localeCompare(String(a.time)));
        const count = Math.min(Number(document.getElementById('optimizeRecordCount')?.value || 5), records.length);
        const model = document.getElementById('optimizeModel')?.value || 'ds-v4-codingplan';
        state.optimizeModel = model;
        state.optimizeRecordCount = count;
        const currentBody = (skill.files['SKILL.md'] || '').replace(/^---\n[\s\S]*?\n---\n*/, '').trim();
        state.optimizeDraft = {
          model,
          count,
          files: {
            'SKILL.md': `---\nname: ${skill.name}\ndescription: ${skill.desc}\n---\n\n${currentBody || `# ${skill.name}`}\n\n## 调用记录优化草稿\n- 基于最新 ${count} 次调用记录，补充失败原因识别、输出边界和用户追问处理。\n- 成功调用需输出可复用结论；失败调用需输出缺失上下文和下一步追问。\n`,
            'reference.md': `${skill.files['reference.md'] || '# Reference\\n'}\n## 调用经验规则\n- 优化模型：${model}\n- 采样记录：最新 ${count} 次调用\n- 失败调用需要优先补充输入缺口判断。\n`
          }
        };
      } else if (action === 'acceptOptimize') {
        if (!state.optimizeDraft) return;
        applyAiDraft(skill, state.optimizeDraft.files);
        state.modal = null;
        state.optimizeDraft = null;
        state.editTab = 'edit';
        state.detailMode = 'edit';
        toast('已接受优化草稿并写入编辑态，可撤销、仅保存或保存并发布。');
      } else if (action === 'rejectOptimize') {
        state.optimizeDraft = null;
        state.modal = null;
        toast('已拒绝优化草稿。');
      } else if (action === 'rollbackVersion') {
        if (state.rollbackSnapshot) {
          skill.version = nextVersion(skill.version);
          skill.files = JSON.parse(JSON.stringify(state.rollbackSnapshot.files));
          skill.name = state.rollbackSnapshot.name;
          skill.desc = state.rollbackSnapshot.desc;
          skill.status = 'draft';
          skill.updated = nowText();
          skill.dirty = false;
          skill.versions.unshift({ version: skill.version, time: nowText(), status: '回滚草稿' });
          toast(`已基于 ${state.rollbackSnapshot.version} 生成回滚草稿 ${skill.version}。`);
          state.rollbackSnapshot = null;
          state.editTab = 'edit';
          state.detailMode = 'edit';
          state.debugOpen = false;
        }
      } else if (action === 'assistantModify') {
        const prompt = document.getElementById('modifyPrompt')?.value.trim() || '补充 Skill 的场景、输入输出和失败处理规则。';
        const generatedName = skill.name && skill.name !== '未命名 Skill' && !skill.name.includes('草稿') ? skill.name : 'AI 生成 Skill';
        const generatedDesc = prompt.length > 90 ? prompt.slice(0, 90) + '...' : prompt;
        const currentBody = (skill.files['SKILL.md'] || '').replace(/^---\n[\s\S]*?\n---\n*/, '').trim();
        applyAiDraft(skill, {
          'SKILL.md': `---\nname: ${generatedName}\ndescription: ${generatedDesc}\n---\n\n${currentBody || `# ${generatedName}`}\n\n## AI 修改\n- ${prompt}\n- 明确适用场景、输入信息、输出格式和失败处理。\n`,
          'reference.md': `${skill.files['reference.md'] || '# Reference\\n'}\n## AI 补充规则\n- 本次修改来源：${prompt}\n`
        });
        toast('AI 修改已写入编辑态，名称和描述已从 SKILL.md 同步到表单。');
      } else if (action === 'undoAiChange') {
        if (!skill.aiUndoSnapshot) {
          toast('暂无可撤销的 AI 修改。');
          return;
        }
        applySkillSnapshot(skill, skill.aiUndoSnapshot);
        skill.aiUndoSnapshot = null;
        applyMarkdownMetaToSkill(skill);
        toast('已撤销本次 AI 修改，文件和表单已同步恢复。');
      } else if (action === 'mockAttach') {
        const type = target.dataset.type;
        toast(`已模拟添加${type}，本次调试会随请求传递。`);
      } else if (action === 'sendDebug') {
        const input = document.getElementById('debugPrompt');
        const text = input?.value.trim();
        if (!text) {
          toast('请输入测试问题。');
          return;
        }
        if (!hasSkillDocContent(skill)) {
          toast('暂无 SKILL.md 内容，无法调试。');
          return;
        }
        if (!skill.debugMessages) skill.debugMessages = [];
        if (skill.debugMessages.length) skill.debugMessages.push({ divider: true });
        skill.debugMessages.push({ role: 'user', text });
        const debugVersion = skill.dirty ? `${skill.version}-temp` : skill.version;
        const answer = `已使用当前技能文件进行调试，包含${skill.dirty ? '未保存的 AI/手动修改' : '已保存版本'} ${debugVersion}。本次是全新 session，输入为：${text}。`;
        skill.debugMessages.push({ role: 'assistant', text: answer });
        input.value = '';
        toast('调试完成：本轮不继承上下文，记录仅保留在当前详情页。');
      } else if (action === 'openSession') {
        state.sessionId = target.dataset.id;
        state.modal = 'session';
      }

      render();
    });

    document.addEventListener('change', (event) => {
      const target = event.target;
      const action = target.dataset.action;
      const skill = getSkill();
      if (action === 'statusFilter') {
        state.statusFilter = target.value;
        render();
      } else if (action === 'toggleVision') {
        skill.modelVision = target.checked;
        if (!skill.modelVision) skill.supportedTypes = skill.supportedTypes.filter(type => type !== 'image');
        render();
      } else if (action === 'toggleType') {
        const type = target.dataset.type;
        if (target.checked && !skill.supportedTypes.includes(type)) skill.supportedTypes.push(type);
        if (!target.checked) skill.supportedTypes = skill.supportedTypes.filter(item => item !== type);
        render();
      } else if (action === 'realImportFiles') {
        const names = Array.from(target.files || []).map(file => file.name);
        state.importItems = names.map((name, index) => {
          const base = name.replace(/\.zip$/i, '').toLowerCase();
          const valid = /^[a-z][a-z0-9_-]*$/.test(base);
          return {
            file: name,
            name: valid ? base : '',
            desc: valid ? `从 ${name} 的 SKILL.md description 自动读取的描述。` : '',
            valid,
            reason: valid ? '' : '文件包内 SKILL.md 的 name 不符合命名规范，或无法读取 name 字段。'
          };
        });
        render();
      }
    });

    document.addEventListener('input', (event) => {
      const target = event.target;
      const action = target.dataset.action;
      const skill = getSkill();
      if (action === 'search') {
        state.query = target.value;
        render();
      } else if (action === 'createPrompt') {
        state.createPrompt = target.value;
      } else if (action === 'fieldInput') {
        skill[target.dataset.field] = target.value;
        syncSkillMarkdown(skill);
        if (state.selectedFile === 'SKILL.md') {
          const editor = document.querySelector?.('[data-action="fileContent"]');
          if (editor) editor.value = skill.files['SKILL.md'] || '';
        }
        markDirty(skill);
      } else if (action === 'fileContent') {
        skill.files[state.selectedFile] = target.value;
        if (state.selectedFile === 'SKILL.md') applyMarkdownMetaToSkill(skill);
        markDirty(skill);
      }
    });

    document.addEventListener('mouseover', (event) => {
      const card = event.target.closest?.('.skill-card');
      if (card) card.classList.add('actions-visible');
    });

    document.addEventListener('mouseout', (event) => {
      const card = event.target.closest?.('.skill-card');
      if (card && !card.contains(event.relatedTarget)) card.classList.remove('actions-visible');
    });

    document.addEventListener('focusin', (event) => {
      const card = event.target.closest?.('.skill-card');
      if (card) card.classList.add('actions-visible');
    });

    document.addEventListener('focusout', (event) => {
      const card = event.target.closest?.('.skill-card');
      if (card && !card.contains(event.relatedTarget)) card.classList.remove('actions-visible');
    });

    document.addEventListener('compositionstart', (event) => {
      if (event.target.matches('[data-enter-submit]')) state.isComposing = true;
    });

    document.addEventListener('compositionend', (event) => {
      if (event.target.matches('[data-enter-submit]')) state.isComposing = false;
    });

    document.addEventListener('keydown', (event) => {
      const target = event.target;
      if (!target.matches('[data-enter-submit]')) return;
      if (event.key !== 'Enter' || event.shiftKey || state.isComposing || event.isComposing) return;
      event.preventDefault();
      const type = target.dataset.enterSubmit;
      if (type === 'create') {
        document.querySelector('[data-action="submitCreate"]')?.click();
      } else if (type === 'debug') {
        document.querySelector('[data-action="sendDebug"]')?.click();
      }
    });

    render();
  </script>
</body>
</html>
