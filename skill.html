<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Skill 模块产品原型</title>
  <style>
    :root {
      --blue: #2468f2;
      --blue-strong: #0f5bff;
      --blue-soft: #e9f1ff;
      --green: #18a058;
      --green-soft: #e8f8ef;
      --orange: #d98512;
      --orange-soft: #fff3df;
      --red: #d92d20;
      --red-soft: #fff0ed;
      --ink: #1f2530;
      --text: #3e4654;
      --muted: #7f8a9a;
      --subtle: #a8b1c0;
      --line: #e6eaf0;
      --panel: #ffffff;
      --soft: #f5f7fb;
      --soft-2: #f0f4fa;
      --shadow: 0 12px 30px rgba(33, 46, 74, .08);
      --radius: 8px;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: var(--font);
      background:
        linear-gradient(180deg, rgba(241, 246, 255, .95), rgba(247, 249, 253, .96) 280px, #f7f9fd 100%);
    }

    body::before {
      content: "admin   admin   admin";
      position: fixed;
      inset: 0;
      z-index: -1;
      color: rgba(120, 132, 156, .08);
      font-size: 15px;
      letter-spacing: 0;
      transform: rotate(-13deg);
      background-image: repeating-linear-gradient(0deg, transparent 0 180px, rgba(255,255,255,.25) 180px 360px);
      white-space: pre;
      pointer-events: none;
    }

    button, input, textarea, select {
      font: inherit;
    }

    button {
      border: 0;
      background: transparent;
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: .55;
    }

    .app {
      min-height: 100vh;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      height: 72px;
      padding: 0 28px;
      border-bottom: 1px solid rgba(215, 221, 232, .9);
      background: rgba(255, 255, 255, .86);
      backdrop-filter: blur(12px);
    }

    .topbar-left,
    .topbar-right,
    .row,
    .inline {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .title-stack h1,
    .title-stack h2,
    .title-stack p {
      margin: 0;
    }

    .title-stack h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0;
    }

    .title-stack h2 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0;
    }

    .title-stack p {
      margin-top: 8px;
      color: var(--muted);
      font-size: 16px;
    }

    .page {
      padding: 28px 36px 42px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 38px;
      padding: 0 16px;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--ink);
      background: #fff;
      box-shadow: 0 1px 2px rgba(28, 39, 61, .04);
      font-weight: 600;
      white-space: nowrap;
      transition: .16s ease;
    }

    .btn:hover {
      border-color: #cad4e5;
      box-shadow: 0 5px 14px rgba(31, 44, 72, .08);
      transform: translateY(-1px);
    }

    .btn-primary {
      border-color: var(--blue);
      color: #fff;
      background: var(--blue);
      box-shadow: 0 6px 14px rgba(36, 104, 242, .24);
    }

    .btn-primary:hover { background: var(--blue-strong); }

    .btn-ghost {
      color: var(--text);
      background: transparent;
      box-shadow: none;
    }

    .btn-soft {
      color: var(--blue);
      border-color: transparent;
      background: var(--blue-soft);
      box-shadow: none;
    }

    .btn-danger {
      color: var(--red);
      border-color: #ffd5cf;
      background: var(--red-soft);
    }

    .icon {
      width: 18px;
      height: 18px;
      display: inline-block;
      color: currentColor;
      flex: 0 0 auto;
    }

    .icon svg {
      width: 100%;
      height: 100%;
      display: block;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .icon-solid svg { fill: currentColor; stroke: none; }

    .back-btn {
      width: 34px;
      height: 34px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
      border-radius: 6px;
    }

    .back-btn:hover { background: var(--soft-2); }

    .toolbar {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      margin: 28px 0 18px;
    }

    .toolbar-left,
    .toolbar-right {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
    }

    .tabs {
      display: inline-flex;
      align-items: center;
      padding: 4px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255,255,255,.9);
    }

    .tab {
      min-width: 82px;
      height: 34px;
      padding: 0 14px;
      border-radius: 6px;
      color: var(--muted);
      font-weight: 600;
    }

    .tab.active {
      color: var(--blue);
      background: var(--blue-soft);
    }

    .control,
    .search {
      height: 40px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--text);
      outline: none;
      transition: .16s ease;
    }

    .control:focus,
    .search:focus,
    textarea:focus,
    input:focus {
      border-color: #8cb0ff;
      box-shadow: 0 0 0 3px rgba(36, 104, 242, .12);
    }

    .control {
      min-width: 128px;
      padding: 0 12px;
    }

    .search-wrap {
      position: relative;
      min-width: 340px;
    }

    .search-wrap .icon {
      position: absolute;
      top: 11px;
      right: 12px;
      color: var(--subtle);
    }

    .search {
      width: 100%;
      padding: 0 42px 0 14px;
    }

    .bulk-bar {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
      padding: 10px 14px;
      border: 1px solid #b8cffd;
      border-radius: 8px;
      background: #f1f6ff;
      color: #24539f;
    }

    .bulk-bar.active { display: flex; }

    .skill-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(280px, 1fr));
      gap: 20px;
    }

    .skill-card {
      position: relative;
      min-height: 220px;
      padding: 26px 28px 18px;
      border: 1px solid rgba(224, 229, 238, .9);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, .88);
      box-shadow: 0 8px 20px rgba(35, 49, 79, .035);
      transition: .16s ease;
    }

    .skill-card:hover {
      border-color: #c8d8fb;
      box-shadow: var(--shadow);
      transform: translateY(-1px);
    }

    .skill-card.selected {
      border-color: #8fb2ff;
      box-shadow: 0 0 0 3px rgba(36, 104, 242, .08);
    }

    .skill-card-head {
      display: grid;
      grid-template-columns: 78px minmax(0, 1fr) auto;
      gap: 20px;
      align-items: start;
    }

    .skill-visual {
      width: 64px;
      height: 64px;
      position: relative;
      border-radius: 8px;
      background: linear-gradient(145deg, #eaf6ff, #dbeeff);
      box-shadow: inset 0 -7px 14px rgba(36, 104, 242, .1);
      overflow: hidden;
    }

    .skill-visual::before,
    .skill-visual::after {
      content: "";
      position: absolute;
      border-radius: 7px;
      transform: rotate(7deg);
    }

    .skill-visual::before {
      width: 32px;
      height: 32px;
      left: 13px;
      top: 17px;
      background: #71d0f7;
      box-shadow: 18px 3px 0 #386cf4;
    }

    .skill-visual::after {
      width: 10px;
      height: 10px;
      left: 26px;
      top: 13px;
      border: 3px solid #41a9e9;
      background: #dff5ff;
      box-shadow: 20px 19px 0 -1px #2858d8;
    }

    .skill-info {
      min-width: 0;
    }

    .skill-info h3 {
      margin: 4px 0 8px;
      font-size: 19px;
      line-height: 1.25;
      letter-spacing: 0;
    }

    .skill-info p {
      height: 48px;
      margin: 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.6;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    .badge-stack {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-height: 24px;
      padding: 0 9px;
      border-radius: 99px;
      color: var(--muted);
      background: #f1f4f8;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
    }

    .badge.blue { color: var(--blue); background: var(--blue-soft); }
    .badge.green { color: var(--green); background: var(--green-soft); }
    .badge.orange { color: var(--orange); background: var(--orange-soft); }
    .badge.red { color: var(--red); background: var(--red-soft); }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 99px;
      background: currentColor;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      max-width: 160px;
      height: 24px;
      padding: 0 8px;
      border: 1px solid #dbe2ec;
      border-radius: 5px;
      color: #647186;
      background: #fff;
      font-size: 13px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .skill-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-left: 98px;
      margin-top: 22px;
      color: var(--muted);
      font-size: 14px;
    }

    .skill-hover-actions {
      position: absolute;
      right: 18px;
      bottom: 14px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      opacity: 0;
      pointer-events: none;
      transform: translateY(6px);
      transition: .16s ease;
    }

    .skill-card:hover .skill-hover-actions,
    .skill-card:focus-within .skill-hover-actions,
    .skill-card.actions-visible .skill-hover-actions {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .checkbox {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 14px;
    }

    input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--blue);
    }

    .switch {
      position: relative;
      display: inline-flex;
      width: 42px;
      height: 24px;
      padding: 2px;
      border-radius: 99px;
      background: #c8d0dc;
      transition: .16s ease;
      vertical-align: middle;
    }

    .switch::after {
      content: "";
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 1px 4px rgba(32, 40, 56, .24);
      transition: .16s ease;
    }

    .switch.on {
      background: var(--blue);
    }

    .switch.on::after {
      transform: translateX(18px);
    }

    .empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 280px;
      border: 1px dashed #cfd8e6;
      border-radius: 8px;
      color: var(--muted);
      background: rgba(255,255,255,.7);
      text-align: center;
    }

    .create-page {
      min-height: calc(100vh - 72px);
      padding: 72px 24px 80px;
      background:
        radial-gradient(circle at 60% 0, rgba(222, 236, 255, .65), transparent 310px),
        linear-gradient(180deg, rgba(255,255,255,.5), rgba(247,249,253,.96));
    }

    .create-inner {
      max-width: 980px;
      margin: 0 auto;
    }

    .assistant-hero {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 240px;
      align-items: end;
      gap: 34px;
      margin-bottom: 34px;
    }

    .assistant-hero h1 {
      margin: 0 0 18px;
      font-size: 40px;
      letter-spacing: 0;
    }

    .assistant-hero p {
      max-width: 680px;
      margin: 0;
      color: #59667a;
      font-size: 18px;
      line-height: 1.8;
    }

    .avatar-illustration {
      position: relative;
      width: 210px;
      height: 190px;
    }

    .avatar-illustration::before {
      content: "Hi，我是你的 Skill 搭建助手";
      position: absolute;
      left: -54px;
      top: 16px;
      min-width: 190px;
      padding: 7px 14px;
      border: 1px solid #9fbaff;
      border-radius: 16px;
      color: #516079;
      background: rgba(255,255,255,.9);
      font-size: 13px;
    }

    .avatar-face {
      position: absolute;
      right: 16px;
      bottom: 0;
      width: 122px;
      height: 148px;
      border-radius: 60px 60px 32px 32px;
      background:
        radial-gradient(circle at 42px 45px, #273140 0 5px, transparent 6px),
        radial-gradient(circle at 78px 45px, #273140 0 5px, transparent 6px),
        linear-gradient(180deg, #f3c9a5 0 58px, #f7d4b7 58px 86px, #e8edf4 86px);
      box-shadow: inset 0 0 0 4px rgba(255,255,255,.55), 0 12px 28px rgba(31,44,72,.14);
    }

    .avatar-face::before {
      content: "";
      position: absolute;
      left: 18px;
      top: -16px;
      width: 88px;
      height: 38px;
      border-radius: 50% 50% 35% 35%;
      background: #2f2530;
      box-shadow: 18px 6px 0 -2px #2f2530;
    }

    .avatar-face::after {
      content: "";
      position: absolute;
      left: 39px;
      top: 68px;
      width: 38px;
      height: 18px;
      border-bottom: 4px solid #a55f54;
      border-radius: 0 0 28px 28px;
    }

    .composer {
      padding: 26px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255,255,255,.94);
      box-shadow: var(--shadow);
    }

    .composer textarea,
    .assistant-box textarea,
    .debug-input textarea {
      width: 100%;
      min-height: 128px;
      padding: 14px;
      border: 0;
      outline: none;
      resize: vertical;
      color: var(--ink);
      background: transparent;
      line-height: 1.65;
    }

    .composer-footer,
    .assistant-footer,
    .debug-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding-top: 14px;
      border-top: 1px solid #eef2f7;
    }

    .model-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 32px;
      color: var(--ink);
      font-weight: 600;
    }

    .model-mark {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: conic-gradient(from 20deg, #2468f2, #27d7a8, #875cff, #2468f2);
    }

    .segmented {
      display: inline-flex;
      align-items: center;
      padding: 3px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #fff;
    }

    .segmented button {
      height: 28px;
      padding: 0 10px;
      border-radius: 5px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
    }

    .segmented button.active {
      color: var(--blue);
      background: var(--blue-soft);
    }

    .edit-shell {
      display: grid;
      grid-template-columns: 420px minmax(0, 1fr) 420px;
      min-height: calc(100vh - 72px);
      background: #fff;
    }

    .edit-shell.view-workbench {
      grid-template-columns: minmax(0, 1fr);
    }

    .edit-shell.debug-collapsed {
      grid-template-columns: 420px minmax(0, 1fr);
    }

    .edit-shell.debug-open {
      grid-template-columns: minmax(0, 1fr);
    }

    .edit-shell.experience-workbench {
      grid-template-columns: minmax(0, 1fr);
      background: #f7f9fd;
    }

    .assistant-panel {
      display: flex;
      flex-direction: column;
      min-height: calc(100vh - 72px);
      border-right: 1px solid var(--line);
      background:
        radial-gradient(circle at 100% 0, rgba(246, 235, 255, .7), transparent 240px),
        linear-gradient(180deg, #fbfcff, #fff);
    }

    .assistant-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 20px 14px;
      border-bottom: 1px solid #edf1f7;
    }

    .assistant-head h3,
    .panel-title h3 {
      margin: 0;
      font-size: 17px;
      letter-spacing: 0;
    }

    .assistant-body {
      flex: 1;
      padding: 22px 20px;
      overflow: auto;
    }

    .assistant-message {
      display: grid;
      grid-template-columns: 34px minmax(0, 1fr);
      gap: 12px;
      margin-bottom: 18px;
    }

    .tiny-avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 12px 13px, #263242 0 3px, transparent 4px),
        radial-gradient(circle at 22px 13px, #263242 0 3px, transparent 4px),
        linear-gradient(180deg, #f2c2a1 0 58%, #e7edf7 58%);
      box-shadow: inset 0 0 0 2px rgba(255,255,255,.65);
    }

    .assistant-copy {
      color: var(--text);
      line-height: 1.65;
    }

    .assistant-box {
      margin: 0 20px 20px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      box-shadow: var(--shadow);
    }

    .assistant-box textarea {
      min-height: 140px;
      border-radius: 8px 8px 0 0;
    }

    .edit-main {
      min-width: 0;
      padding: 28px 30px 50px;
      overflow: auto;
      background: #fff;
    }

    .edit-main-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 24px;
    }

    .section {
      margin-bottom: 28px;
    }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .section-title h3 {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin: 0;
      font-size: 19px;
      letter-spacing: 0;
    }

    .form-panel,
    .file-panel,
    .experience-panel,
    .debug-panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }

    .form-panel {
      padding: 22px;
      background: #f7f9fc;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px 22px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 9px;
      min-width: 0;
    }

    .field.full { grid-column: 1 / -1; }

    .field label {
      color: var(--text);
      font-weight: 600;
    }

    .field small {
      color: var(--muted);
      line-height: 1.5;
    }

    .field input,
    .field textarea,
    .field select {
      width: 100%;
      min-height: 42px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--ink);
      background: #fff;
      outline: none;
    }

    .field textarea {
      min-height: 104px;
      resize: vertical;
      line-height: 1.55;
    }

    .field.disabled input {
      color: #aeb7c5;
      background: #f7f9fc;
    }

    .required {
      color: var(--red);
      margin-right: 4px;
    }

    .capability-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(104px, 1fr));
      gap: 10px;
    }

    .capability {
      min-height: 54px;
      padding: 9px 10px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #fff;
    }

    .capability.active {
      border-color: #9db9ff;
      background: #f1f6ff;
    }

    .file-panel {
      display: grid;
      grid-template-columns: 300px minmax(0, 1fr);
      min-height: 420px;
      overflow: hidden;
    }

    .file-tree {
      border-right: 1px solid var(--line);
      background: #f7f9fc;
    }

    .file-tree-head,
    .editor-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 46px;
      padding: 0 14px;
      border-bottom: 1px solid var(--line);
      color: var(--text);
      font-weight: 700;
    }

    .file-list {
      padding: 12px;
    }

    .file-item {
      display: flex;
      align-items: center;
      gap: 9px;
      width: 100%;
      height: 38px;
      padding: 0 10px;
      border-radius: 6px;
      color: var(--text);
      text-align: left;
    }

    .file-item:hover,
    .file-item.active {
      background: #eef3fb;
    }

    .file-item.active {
      color: var(--blue);
      font-weight: 700;
    }

    .code-editor {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 420px;
    }

    .code-editor textarea {
      flex: 1;
      width: 100%;
      min-height: 360px;
      padding: 18px;
      border: 0;
      resize: none;
      outline: none;
      color: #293244;
      background: #fff;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 13px;
      line-height: 1.65;
    }

    .experience-panel {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: calc(100vh - 72px);
      border-top: 0;
      border-right: 0;
      border-bottom: 0;
      border-radius: 0;
      background:
        linear-gradient(180deg, rgba(247, 250, 255, .98), rgba(255,255,255,.98));
      overflow: auto;
    }

    .experience-workbench .experience-panel {
      border: 0;
      border-radius: 0;
      background: transparent;
    }

    .experience-workbench .metric-grid {
      grid-template-columns: repeat(3, minmax(220px, 1fr));
    }

    .experience-workbench .experience-body {
      display: block;
      padding: 24px;
    }

    .experience-list {
      min-width: 0;
      width: 100%;
    }

    .call-record-table-wrap {
      width: 100%;
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }

    .call-record-table {
      min-width: 1120px;
      border: 0;
      table-layout: fixed;
    }

    .call-record-table th,
    .call-record-table td {
      white-space: nowrap;
    }

    .call-record-table th:nth-child(1),
    .call-record-table td:nth-child(1) { width: 120px; }

    .call-record-table th:nth-child(2),
    .call-record-table td:nth-child(2) { width: 110px; }

    .call-record-table th:nth-child(3),
    .call-record-table td:nth-child(3) { width: 250px; }

    .call-record-table th:nth-child(4),
    .call-record-table td:nth-child(4) { width: 180px; }

    .call-record-table th:nth-child(5),
    .call-record-table td:nth-child(5) { width: 80px; }

    .call-record-table th:nth-child(6),
    .call-record-table td:nth-child(6) { width: 90px; }

    .call-record-table th:nth-child(7),
    .call-record-table td:nth-child(7) { width: 150px; }
    }

    .experience-head {
      position: sticky;
      top: 0;
      z-index: 5;
      padding: 24px 24px 18px;
      border-bottom: 1px solid var(--line);
      background: rgba(248, 250, 255, .94);
      backdrop-filter: blur(12px);
    }

    .panel-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .metric {
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }

    .metric strong {
      display: block;
      font-size: 22px;
      letter-spacing: 0;
    }

    .metric span {
      color: var(--muted);
      font-size: 12px;
    }

    .metric small {
      display: block;
      margin-top: 8px;
      color: var(--subtle);
      font-size: 12px;
      line-height: 1.45;
    }

    .experience-body {
      padding: 18px 24px 28px;
    }

    .call-card {
      padding: 14px;
      margin-bottom: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }

    .call-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
    }

    .call-card p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .call-fragments {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-top: 12px;
    }

    .fragment {
      padding: 9px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #f8fafc;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .fragment strong {
      display: block;
      margin-bottom: 4px;
      color: var(--text);
      font-size: 12px;
    }

    .hint {
      padding: 11px 12px;
      border: 1px solid #ffdca7;
      border-radius: 8px;
      color: #845200;
      background: #fff8eb;
      line-height: 1.55;
      font-size: 13px;
    }

    .hint.blue {
      border-color: #bfd1ff;
      color: #26539a;
      background: #f2f6ff;
    }

    .debug-drawer {
      position: fixed;
      top: 72px;
      right: 0;
      bottom: 0;
      z-index: 35;
      width: min(520px, 100vw);
      border-left: 1px solid var(--line);
      background: #fff;
      box-shadow: -18px 0 32px rgba(31,44,72,.1);
      display: flex;
      flex-direction: column;
    }

    .debug-scrim {
      position: fixed;
      inset: 72px 0 0;
      z-index: 34;
      background: rgba(17, 24, 39, .08);
    }

    .debug-panel {
      position: sticky;
      top: 72px;
      align-self: start;
      display: flex;
      flex-direction: column;
      height: calc(100vh - 72px);
      min-width: 0;
      border-top: 0;
      border-right: 0;
      border-bottom: 0;
      border-radius: 0;
      background: #fff;
      box-shadow: -8px 0 22px rgba(31,44,72,.04);
    }

    .debug-drawer .debug-panel {
      position: static;
      top: auto;
      width: 100%;
      height: 100%;
      box-shadow: none;
    }

    .debug-panel .debug-input {
      margin: 0 20px 20px;
    }

    .debug-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 22px 24px;
      border-bottom: 1px solid var(--line);
    }

    .debug-head h3 { margin: 0; font-size: 18px; }

    .debug-body {
      flex: 1;
      padding: 22px 24px;
      overflow: auto;
      background:
        linear-gradient(180deg, #f9fbff, #fff 180px);
    }

    .preview-card {
      display: grid;
      grid-template-columns: 76px minmax(0, 1fr);
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
      padding: 20px;
      border-radius: 8px;
      background: rgba(255,255,255,.88);
      box-shadow: var(--shadow);
    }

    .debug-log {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin: 12px 0 22px;
    }

    .bubble {
      max-width: 88%;
      padding: 12px 14px;
      border-radius: 8px;
      line-height: 1.6;
      font-size: 14px;
    }

    .bubble.user {
      align-self: flex-end;
      color: #fff;
      background: var(--blue);
    }

    .bubble.assistant {
      align-self: flex-start;
      color: var(--text);
      background: #f0f4fa;
    }

    .session-divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 20px 0;
      color: var(--subtle);
      font-size: 12px;
    }

    .session-divider::before,
    .session-divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--line);
    }

    .debug-input {
      margin: 0 24px 22px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      box-shadow: var(--shadow);
    }

    .debug-input textarea {
      min-height: 96px;
    }

    .attach-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 0 12px 12px;
    }

    .attach-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 28px;
      padding: 0 9px;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--muted);
      background: #fff;
      font-size: 13px;
    }

    .attach-chip.enabled {
      color: #24539f;
      border-color: #bdd1ff;
      background: #f2f6ff;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 60;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px;
      background: rgba(24, 31, 42, .46);
    }

    .modal {
      width: min(980px, 100%);
      max-height: min(84vh, 860px);
      display: flex;
      flex-direction: column;
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 22px 80px rgba(17, 24, 39, .24);
      overflow: hidden;
    }

    .modal.small { width: min(640px, 100%); }
    .modal.wide { width: min(1180px, 100%); }

    .modal-head,
    .modal-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 20px 24px;
      border-bottom: 1px solid var(--line);
    }

    .modal-foot {
      justify-content: flex-end;
      border-top: 1px solid var(--line);
      border-bottom: 0;
      background: #fbfcff;
    }

    .modal-head h2,
    .modal-head h3 {
      margin: 0;
      letter-spacing: 0;
    }

    .modal-body {
      padding: 22px 24px;
      overflow: auto;
    }

    .upload-zone {
      min-height: 230px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      border: 1px dashed #cfd8e6;
      border-radius: 8px;
      color: var(--muted);
      background: #fbfdff;
      text-align: center;
    }

    .upload-mark {
      width: 58px;
      height: 58px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      color: var(--blue);
      background: var(--blue-soft);
    }

    .table {
      width: 100%;
      border-collapse: collapse;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      font-size: 14px;
    }

    .table th,
    .table td {
      padding: 12px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
    }

    .table th {
      color: var(--text);
      background: #f6f8fb;
      font-weight: 700;
    }

    .table tr:last-child td { border-bottom: 0; }

    .version-compare-card {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto;
      align-items: end;
      gap: 14px;
      margin-bottom: 16px;
      padding: 16px;
      border: 1px solid #cbd9ff;
      border-radius: 8px;
      background: #f6f9ff;
    }

    .version-save-summary {
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr);
      gap: 12px;
      align-items: start;
      margin-bottom: 18px;
      padding: 14px;
      border: 1px solid #dbe6ff;
      border-radius: 8px;
      background: linear-gradient(180deg, #f8fbff, #fff);
    }

    .version-save-summary .summary-icon {
      width: 42px;
      height: 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      color: var(--blue);
      background: var(--blue-soft);
    }

    .version-save-summary strong {
      display: block;
      margin-bottom: 4px;
      color: var(--text);
      font-size: 16px;
    }

    .version-mode-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }

    .version-mode-card {
      position: relative;
      display: grid;
      grid-template-columns: 22px minmax(0, 1fr);
      gap: 10px;
      min-height: 108px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      cursor: pointer;
    }

    .version-mode-card:has(input:checked) {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(31, 111, 235, .1);
    }

    .version-mode-card.disabled {
      color: var(--subtle);
      background: #f7f8fb;
      cursor: not-allowed;
    }

    .version-mode-card strong {
      display: block;
      margin-bottom: 6px;
      color: var(--text);
      font-size: 16px;
    }

    .version-mode-card span {
      display: block;
      color: var(--muted);
      line-height: 1.55;
    }

    .version-form-card {
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fbfcff;
    }

    .diff-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .diff-pane {
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
    }

    .diff-title {
      padding: 11px 12px;
      border-bottom: 1px solid var(--line);
      color: var(--text);
      background: #f7f9fc;
      font-weight: 700;
    }

    pre.diff {
      min-height: 330px;
      max-height: 480px;
      margin: 0;
      padding: 14px;
      overflow: auto;
      white-space: pre-wrap;
      color: #2c3444;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 13px;
      line-height: 1.65;
      background: #fff;
    }

    .line-add { background: #eaf8ef; color: #13783d; display: block; }
    .line-del { background: #fff0ed; color: #b42318; display: block; text-decoration: line-through; }
    .line-same { display: block; }

    .toast-wrap {
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 80;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .toast {
      min-width: 260px;
      max-width: 380px;
      padding: 12px 14px;
      border: 1px solid #c7d8ff;
      border-radius: 8px;
      color: #1f4f9a;
      background: #f2f6ff;
      box-shadow: var(--shadow);
      line-height: 1.5;
    }

    .muted { color: var(--muted); }
    .subtle { color: var(--subtle); }
    .mt-12 { margin-top: 12px; }
    .mt-16 { margin-top: 16px; }
    .mt-20 { margin-top: 20px; }
    .mb-12 { margin-bottom: 12px; }
    .w-100 { width: 100%; }
    .hidden-file { display: none; }

    .prototype-nav {
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 0 32px;
      border-bottom: 1px solid #e5e6eb;
      background: rgba(255, 255, 255, .96);
      box-shadow: 0 1px 6px rgba(31, 35, 41, .04);
      font-family: var(--font);
      position: relative;
      z-index: 1000;
    }

    .prototype-nav__brand {
      color: #1f2329;
      font-size: 15px;
      font-weight: 700;
      white-space: nowrap;
    }

    .prototype-nav__links {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .prototype-nav__links a {
      height: 32px;
      display: inline-flex;
      align-items: center;
      padding: 0 14px;
      border-radius: 7px;
      color: #646a73;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
    }

    .prototype-nav__links a:hover {
      color: #2f6bff;
      background: #eef3ff;
    }

    .prototype-nav__links a.active {
      color: #2f6bff;
      background: #e8efff;
    }

    @media (max-width: 1360px) {
      .skill-grid { grid-template-columns: repeat(2, minmax(280px, 1fr)); }
      .edit-shell { grid-template-columns: 300px minmax(0, 1fr); }
      .edit-shell.debug-collapsed { grid-template-columns: 300px minmax(0, 1fr); }
      .edit-shell.debug-open { grid-template-columns: 1fr; }
      .debug-panel,
      .experience-panel {
        grid-column: 1 / -1;
        min-height: auto;
        height: auto;
        position: static;
        border-left: 0;
        border-top: 1px solid var(--line);
      }
      .experience-workbench .metric-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 920px) {
      .page { padding: 22px 18px 36px; }
      .topbar {
        height: auto;
        min-height: 72px;
        padding: 14px 18px;
        align-items: flex-start;
        flex-direction: column;
      }
      .topbar-right { flex-wrap: wrap; }
      .toolbar { flex-direction: column; }
      .search-wrap { min-width: min(100%, 340px); width: 100%; }
      .skill-grid { grid-template-columns: 1fr; }
      .skill-card-head { grid-template-columns: 64px minmax(0, 1fr); }
      .badge-stack { grid-column: 1 / -1; flex-direction: row; align-items: center; margin-left: 84px; }
      .skill-meta { margin-left: 84px; }
      .assistant-hero { grid-template-columns: 1fr; }
      .avatar-illustration { display: none; }
      .edit-shell { grid-template-columns: 1fr; }
      .edit-shell.debug-collapsed { grid-template-columns: 1fr; }
      .edit-shell.debug-open { grid-template-columns: 1fr; }
      .assistant-panel { min-height: auto; border-right: 0; border-bottom: 1px solid var(--line); }
      .form-grid,
      .file-panel,
      .diff-grid,
      .version-compare-card,
      .version-mode-grid,
      .experience-workbench .experience-body { grid-template-columns: 1fr; }
      .file-tree { border-right: 0; border-bottom: 1px solid var(--line); }
    }

    @media (max-width: 560px) {
      .skill-card { padding: 20px 16px 16px; }
      .skill-meta, .badge-stack { margin-left: 0; }
      .composer-footer,
      .assistant-footer,
      .debug-footer,
      .modal-foot { flex-direction: column; align-items: stretch; }
      .btn { width: 100%; }
      .create-page { padding: 40px 16px; }
      .assistant-hero h1 { font-size: 30px; }
      .debug-drawer { top: 0; }
    }
  </style>
</head>

    hydrateVersionMockData();

    function hydrateVersionMockData() {
      Object.entries(versionMockData).forEach(([id, versions]) => {
        const skill = skills.find(item => item.id === id);
        if (!skill || !versions.length) return;
        const latest = versions[0];
        skill.version = latest.version;
        skill.updated = latest.time;
        skill.status = latest.status === '已发布' ? 'published' : 'draft';
        skill.enabled = latest.status === '已发布';
        skill.files = cloneFiles(latest.files);
        skill.versions = versions.map(item => ({
          ...item,
          creator: item.creator || skill.owner || 'MarketingAgent',
          files: cloneFiles(item.files)
        }));
      });
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, (char) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[char]));
    }

    function getSkill() {
      return skills.find(item => item.id === state.selectedSkillId) || skills[0];
    }

    function isOfficial(skill) {
      return skill.origin === 'official';
    }

    function metric(records) {
      const total = records.length;
      const completed = records.filter(item => item.status === 'success' || item.status === 'failed');
      const success = records.filter(item => item.status === 'success').length;
      const avg = completed.length
        ? (completed.reduce((sum, item) => sum + item.duration, 0) / completed.length).toFixed(1)
        : '-';
      return {
        total,
        completed: completed.length,
        success,
        successRate: completed.length ? Math.round(success / completed.length * 100) + '%' : '-',
        avg
      };
    }

    function hasSkillDocContent(skill) {
      return !!String(skill.files?.['SKILL.md'] || '').trim();
    }

    function parseSkillMarkdownMeta(markdown) {
      const text = String(markdown || '');
      const match = text.match(/^---\n([\s\S]*?)\n---/);
      if (!match) return {};
      const meta = {};
      match[1].split('\n').forEach(line => {
        const index = line.indexOf(':');
        if (index <= 0) return;
        const key = line.slice(0, index).trim();
        const value = line.slice(index + 1).trim();
        if (key === 'name' || key === 'description') meta[key] = value;
      });
      return meta;
    }

    function applyMarkdownMetaToSkill(skill) {
      const meta = parseSkillMarkdownMeta(skill.files?.['SKILL.md']);
      if (meta.name) skill.name = meta.name;
      if (meta.description) skill.desc = meta.description;
      const nameField = document.querySelector?.('[data-field="name"]');
      const descField = document.querySelector?.('[data-field="desc"]');
      if (nameField) nameField.value = skill.name;
      if (descField) descField.value = skill.desc;
    }

    function captureSkillSnapshot(skill) {
      return {
        name: skill.name,
        desc: skill.desc,
        files: cloneFiles(skill.files),
        selectedFile: state.selectedFile,
        dirty: !!skill.dirty
      };
    }

    function applySkillSnapshot(skill, snapshot) {
      if (!snapshot) return;
      skill.name = snapshot.name;
      skill.desc = snapshot.desc;
      skill.files = cloneFiles(snapshot.files);
      state.selectedFile = snapshot.selectedFile || 'SKILL.md';
      skill.dirty = !!snapshot.dirty;
      document.querySelectorAll('[data-dirty-indicator]').forEach(node => {
        node.className = `badge ${skill.dirty ? 'orange' : 'green'}`;
        node.textContent = skill.dirty ? '未保存变更' : '已保存';
      });
    }

    function applyAiDraft(skill, files, options = {}) {
      skill.aiUndoSnapshot = captureSkillSnapshot(skill);
      skill.files = { ...cloneFiles(skill.files), ...cloneFiles(files) };
      state.selectedFile = options.selectedFile || 'SKILL.md';
      applyMarkdownMetaToSkill(skill);
      markDirty(skill);
    }

    function clearTransientDebug(skill) {
      if (skill) skill.debugMessages = [];
      state.debugOpen = false;
    }

    function skillStatusBadge(skill) {
      if (skill.status === 'published') {
        return '<span class="badge blue"><span class="dot"></span>已发布</span>';
      }
      return '<span class="badge"><span class="dot"></span>未发布</span>';
    }

    function originBadge(skill) {
      if (skill.origin === 'official') return '<span class="badge green">官方 Skill</span>';
      if (skill.origin === 'imported') return '<span class="badge orange">导入 Skill</span>';
      return '<span class="badge">我的 Skill</span>';
    }

    function renderThinkingSwitch(isOn, action) {
      return `
        <button class="btn btn-ghost" data-action="${action}">
          <span class="switch ${isOn ? 'on' : ''}" aria-hidden="true"></span>
          思考${isOn ? '开启' : '关闭'}
        </button>
      `;
    }

    function render() {
      const app = document.getElementById('app');
      if (state.route === 'edit') app.innerHTML = renderEdit();
      else app.innerHTML = renderList();
      renderModal();
    }

    function renderList() {
      const filtered = skills.filter(skill => {
        const tabOk = state.activeTab === 'all'
          || (state.activeTab === 'mine' && skill.origin !== 'official')
          || (state.activeTab === 'official' && skill.origin === 'official');
        const statusOk = state.statusFilter === 'all' || skill.status === state.statusFilter || (state.statusFilter === 'enabled' && skill.enabled);
        const query = state.query.trim().toLowerCase();
        const queryOk = !query || [skill.name, skill.desc, skill.owner, skill.agent, skill.tags.join(' ')].join(' ').toLowerCase().includes(query);
        return tabOk && statusOk && queryOk;
      });

      return `
        <header class="topbar">
          <div class="title-stack">
            <h1>Skill中心</h1>
            <p>Skill 是平台中可复用的能力单元，在 MCP 工具之上沉淀为可编辑、可测试、可复用的标准能力资产。</p>
          </div>
          <div class="topbar-right">
            <button class="btn btn-primary" data-action="openCreate">${icon('spark')}对话创建 Skill</button>
            <button class="btn" data-action="manualCreate">${icon('plus')}手动创建 Skill</button>
            <button class="btn" data-action="openImport">${icon('upload')}导入 Skill</button>
            <button class="btn" data-action="openExport" ${state.selectedExports.size ? '' : 'disabled'}>${icon('download')}导出已选</button>
          </div>
        </header>

        <main class="page">
          <div class="toolbar">
            <div class="toolbar-left">
              <div class="tabs" role="tablist" aria-label="Skill 分类">
                ${['all', 'mine', 'official'].map(tab => `
                  <button class="tab ${state.activeTab === tab ? 'active' : ''}" data-action="setTab" data-tab="${tab}">
                    ${tab === 'all' ? '全部' : tab === 'mine' ? '我的' : '官方 Skill'}
                  </button>
                `).join('')}
              </div>
              <select class="control" data-action="statusFilter" aria-label="状态筛选">
                <option value="all" ${state.statusFilter === 'all' ? 'selected' : ''}>全部状态</option>
                <option value="enabled" ${state.statusFilter === 'enabled' ? 'selected' : ''}>已开启</option>
                <option value="published" ${state.statusFilter === 'published' ? 'selected' : ''}>已发布</option>
                <option value="draft" ${state.statusFilter === 'draft' ? 'selected' : ''}>未发布</option>
              </select>
              <div class="search-wrap">
                <input class="search" data-action="search" value="${escapeHtml(state.query)}" placeholder="请输入关键词进行搜索">
                ${icon('search')}
              </div>
            </div>
            <div class="toolbar-right">
              <span class="muted">共 ${filtered.length} 个，官方 ${skills.filter(isOfficial).length} 个</span>
            </div>
          </div>

          <div class="bulk-bar ${state.selectedExports.size ? 'active' : ''}">
            <span>已选择 ${state.selectedExports.size} 个 Skill，可批量导出为独立包。</span>
            <div class="inline">
              <button class="btn btn-soft" data-action="selectAllVisible" data-ids="${filtered.map(s => s.id).join(',')}">选择当前页</button>
              <button class="btn" data-action="clearSelected">清空</button>
              <button class="btn btn-primary" data-action="openExport">${icon('download')}导出 ${state.selectedExports.size} 个包</button>
            </div>
          </div>

          ${filtered.length ? `
            <section class="skill-grid">
              ${filtered.map(renderSkillCard).join('')}
            </section>
          ` : `
            <section class="empty">
              ${icon('search')}
              <h3>没有找到匹配的 Skill</h3>
              <p>换个关键词，或先通过导入、对话创建补充能力资产。</p>
            </section>
          `}
        </main>
      `;
    }

    function renderSkillCard(skill) {
      const checked = state.selectedExports.has(skill.id) ? 'checked' : '';
      const isPublished = skill.status === 'published';
      const canEditCard = !isOfficial(skill);
      return `
        <article class="skill-card ${checked ? 'selected' : ''}" data-skill-id="${skill.id}">
          <div class="skill-card-head">
            <div class="skill-visual" aria-hidden="true"></div>
            <div class="skill-info">
              <h3>${escapeHtml(skill.name)}</h3>
              <p>${escapeHtml(skill.desc)}</p>
            </div>
            <div class="badge-stack">
              ${skillStatusBadge(skill)}
              ${originBadge(skill)}
            </div>
          </div>
          <div class="skill-meta">
            <span>更新时间 ${skill.updated}</span>
            <span>|</span>
            <span>创建人 ${skill.owner}</span>
            <span>|</span>
            <span>${skill.agent}</span>
          </div>
          <div class="skill-hover-actions" aria-label="${escapeHtml(skill.name)} 操作">
            <button class="btn ${checked ? 'btn-soft' : ''}" data-action="toggleSelectExport" data-id="${skill.id}">
              ${checked ? icon('check') + '取消选择' : icon('check') + '选择'}
            </button>
            <button class="btn" data-action="singleExport" data-id="${skill.id}">${icon('download')}导出</button>
            <button class="btn ${isPublished ? '' : 'btn-primary'}" data-action="togglePublishFromCard" data-id="${skill.id}">
              ${isPublished ? icon('refresh') + '取消发布' : icon('send') + '发布'}
            </button>
            <button class="btn" data-action="openCardEdit" data-id="${skill.id}" ${canEditCard ? '' : 'disabled title="官方 Skill 只读，不支持直接编辑"'}>${icon('edit')}编辑</button>
            <button class="btn btn-danger" data-action="requestDeleteSkill" data-id="${skill.id}">${icon('close')}删除</button>
          </div>
        </article>
      `;
    }

    function renderEdit() {
      const skill = getSkill();
      const records = skill.records || [];
      const stats = metric(records);
      const selectedFile = state.selectedFile && skill.files[state.selectedFile] !== undefined
        ? state.selectedFile
        : Object.keys(skill.files)[0] || 'SKILL.md';
      state.selectedFile = selectedFile;
      const isEmptyDocs = Object.values(skill.files || {}).every(value => !String(value || '').trim());
      const requestedTab = state.editTab || 'edit';
      const isOfficialSkill = isOfficial(skill);
      const canEditSkill = !isOfficialSkill;
      const detailMode = canEditSkill ? (state.detailMode || 'view') : 'view';
      const activeTab = detailMode === 'edit' ? 'edit' : requestedTab;
      const isEditing = activeTab === 'edit' && detailMode === 'edit';
      const canShowExperience = detailMode === 'view';
      const hasDocs = hasSkillDocContent(skill);
      const isDebugOpen = isEditing && hasDocs && state.debugOpen;
      const shellClass = activeTab === 'experience'
        ? 'experience-workbench'
        : detailMode === 'view'
          ? 'view-workbench'
          : isDebugOpen
            ? 'debug-open'
            : 'debug-collapsed';

      return `
        <header class="topbar">
          <div class="topbar-left">
            <button class="back-btn" data-action="goList" aria-label="返回">${icon('back')}</button>
            <div class="title-stack"><h2>${detailMode === 'edit' ? '编辑 Skill' : '查看 Skill'}</h2></div>
          </div>
          <div class="tabs" role="tablist" aria-label="Skill 详情页">
            <button class="tab ${activeTab === 'edit' ? 'active' : ''}" data-action="setEditTab" data-tab="edit">${detailMode === 'edit' ? '编辑Skill' : '查看Skill'}</button>
            ${canShowExperience ? `<button class="tab ${activeTab === 'experience' ? 'active' : ''}" data-action="setEditTab" data-tab="experience">调用经验</button>` : ''}
          </div>
          <div class="topbar-right">
            ${activeTab === 'edit' && detailMode === 'view' ? `<button class="btn ${canEditSkill ? 'btn-primary' : ''}" data-action="enterEditMode" ${canEditSkill ? '' : 'disabled title="官方 Skill 只读，不支持直接编辑"'}>${icon('edit')}编辑</button>` : ''}
            ${isEditing && state.rollbackSnapshot ? `<button class="btn" data-action="rollbackVersion">${icon('refresh')}回滚到 ${state.rollbackSnapshot.version}</button>` : ''}
            ${isEditing ? `
              <button class="btn" data-action="openVersion">${icon('history')}版本管理：${escapeHtml(skill.version)}</button>
              <button class="btn" data-action="saveSkill">${icon('save')}仅保存</button>
              <button class="btn btn-primary" data-action="publishSkill">${icon('send')}保存并发布</button>
            ` : ''}
          </div>
        </header>

        <main class="edit-shell ${shellClass}">
          ${activeTab === 'edit' && detailMode === 'edit' ? `
            ${!isDebugOpen ? `<aside class="assistant-panel">
              <div class="assistant-head">
                <h3>${icon('spark')}对话编辑</h3>
                <button class="back-btn" title="收起">${icon('close')}</button>
              </div>
              <div class="assistant-body">
                <div class="assistant-message">
                  <div class="tiny-avatar"></div>
                  <div class="assistant-copy">描述你希望调整的功能需求、使用场景、交互逻辑与实现效果。我会把建议同步到技能信息和技能文件中。</div>
                </div>
                <div class="hint blue">AI 修改会读取当前编辑态。模型和思考开关只属于对话生成/修改过程，不写入 Skill 基础配置。</div>
              </div>
              <section class="assistant-box">
                <textarea id="modifyPrompt" placeholder="例如：增强扫描版 PDF 的 OCR 策略，并在失败时输出可重试原因。"></textarea>
                <div class="assistant-footer">
                  <div class="inline">
                    <span class="model-pill"><span class="model-mark"></span>ds-v4-codingplan</span>
                    ${renderThinkingSwitch(skill.thinkingOn !== false, 'toggleThinking')}
                  </div>
                  <button class="btn btn-primary" data-action="assistantModify">${icon('send')}</button>
                </div>
              </section>
            </aside>` : ''}

            <section class="edit-main">
              <div class="edit-main-head">
                <div class="title-stack">
                  <h2>编辑Skill</h2>
                  <p>编辑区修改后会出现未保存状态；仅保存会覆盖当前草稿或另存草稿，保存并发布一定创建新版本；展开调试预览可使用当前编辑态。</p>
                </div>
                <div class="inline">
                  <span class="badge ${skill.dirty ? 'orange' : 'green'}" data-dirty-indicator>${skill.dirty ? '未保存变更' : '已保存'}</span>
                  ${skill.aiUndoSnapshot ? `<button class="btn" data-action="undoAiChange">${icon('refresh')}撤销 AI 修改</button>` : ''}
                  <button class="btn btn-soft" data-action="toggleDebugPanel" ${hasDocs ? '' : 'disabled title="暂无 SKILL.md 内容，无法调试"'}>${icon('flask')}${state.debugOpen ? '收起调试预览' : '展开调试预览'}</button>
                </div>
              </div>

              ${isEmptyDocs ? `<div class="hint mb-12">${icon('alert')} 当前暂无 SKILL.md 文档内容，调试预览不可用。请先通过 AI 修改或手动补充技能文档。</div>` : ''}

              <section class="section">
                <div class="section-title"><h3>${icon('settings')}技能信息</h3></div>
                <div class="form-panel">
                  <div class="form-grid">
                    <div class="field">
                      <label>Skill 展示名称</label>
                      <input data-action="fieldInput" data-field="name" value="${escapeHtml(skill.name)}">
                    </div>
                    <div class="field disabled">
                      <label>Skill ID</label>
                      <input value="${escapeHtml(skill.id)}" disabled>
                    </div>
                    <div class="field full">
                      <label><span class="required">*</span>Skill 描述</label>
                      <textarea data-action="fieldInput" data-field="desc" maxlength="500">${escapeHtml(skill.desc)}</textarea>
                      <small>${escapeHtml(skill.desc).length}/500。导入 Skill 包时会自动读取 SKILL.md front matter 的 name 与 description。</small>
                    </div>
                  </div>
                </div>
              </section>

              <section class="section">
                <div class="section-title">
                  <h3>${icon('file')}技能文件</h3>
                  <div class="inline">
                    <button class="btn" data-action="openVersion">${icon('history')}版本管理</button>
                  </div>
                </div>
                <div class="file-panel">
                  <aside class="file-tree">
                    <div class="file-tree-head">资源目录</div>
                    <div class="file-list">
                      ${Object.keys(skill.files).map(file => `
                        <button class="file-item ${file === selectedFile ? 'active' : ''}" data-action="selectFile" data-file="${escapeHtml(file)}">
                          ${icon(file.includes('/') ? 'folder' : 'file')}${escapeHtml(file)}
                        </button>
                      `).join('')}
                    </div>
                  </aside>
                  <section class="code-editor">
                    <div class="editor-head">
                      <span>${escapeHtml(selectedFile)}</span>
                      <span class="muted">${skill.dirty ? '未保存变更会以临时草稿参与调试' : '当前内容已保存为草稿/版本'}</span>
                    </div>
                    <textarea data-action="fileContent" spellcheck="false">${escapeHtml(skill.files[selectedFile] || '')}</textarea>
                  </section>
                </div>
              </section>
            </section>

            ${isDebugOpen ? renderDebugDrawer(skill) : ''}
          ` : activeTab === 'edit' ? renderSkillViewTab(skill, selectedFile) : renderExperienceTab(skill, records, stats)}
        </main>
      `;
    }

    function renderSkillViewTab(skill, selectedFile) {
      return `
        <section class="edit-main">
          <div class="edit-main-head">
            <div class="title-stack">
              <h2>查看Skill</h2>
              <p>${isOfficial(skill) ? '官方 Skill 为平台只读资产，可查看基础信息和技能文件，不能直接编辑或通过对话修改。' : '当前内容来自已保存版本，基础信息和技能文件为只读。'}</p>
            </div>
            <div class="inline">
              ${originBadge(skill)}
              ${skillStatusBadge(skill)}
            </div>
          </div>

          <section class="section">
            <div class="section-title"><h3>${icon('settings')}技能信息</h3></div>
            <div class="form-panel">
              <div class="form-grid">
                <div class="field">
                  <label>Skill 展示名称</label>
                  <input value="${escapeHtml(skill.name)}" readonly>
                </div>
                <div class="field disabled">
                  <label>Skill ID</label>
                  <input value="${escapeHtml(skill.id)}" disabled>
                </div>
                <div class="field full">
                  <label>Skill 描述</label>
                  <textarea readonly>${escapeHtml(skill.desc)}</textarea>
                </div>
              </div>
            </div>
          </section>

          <section class="section">
            <div class="section-title">
              <h3>${icon('file')}技能文件</h3>
              <button class="btn" data-action="openVersion">${icon('history')}版本管理</button>
            </div>
            <div class="file-panel">
              <aside class="file-tree">
                <div class="file-tree-head">资源目录</div>
                <div class="file-list">
                  ${Object.keys(skill.files).map(file => `
                    <button class="file-item ${file === selectedFile ? 'active' : ''}" data-action="selectFile" data-file="${escapeHtml(file)}">
                      ${icon(file.includes('/') ? 'folder' : 'file')}${escapeHtml(file)}
                    </button>
                  `).join('')}
                </div>
              </aside>
              <section class="code-editor">
                <div class="editor-head">
                  <span>${escapeHtml(selectedFile)}</span>
                  <span class="muted">只读预览</span>
                </div>
                <textarea readonly spellcheck="false">${escapeHtml(skill.files[selectedFile] || '')}</textarea>
              </section>
            </div>
          </section>
        </section>
      `;
    }

    function renderExperienceTab(skill, records, stats) {
      const sorted = [...records].sort((a, b) => String(b.time).localeCompare(String(a.time)));
      const pageSize = 10;
      const totalPages = Math.max(1, Math.ceil(sorted.length / pageSize));
      state.experiencePage = Math.min(Math.max(state.experiencePage || 1, 1), totalPages);
      const pageRecords = sorted.slice((state.experiencePage - 1) * pageSize, state.experiencePage * pageSize);
      const canOptimize = !isOfficial(skill);
      return `
        <aside class="experience-panel">
          <div class="experience-head">
            <div class="panel-title">
              <div>
                <h3>${icon('clock')}调用经验</h3>
                <p class="muted mt-12">仅在查看态展示线上调用记录；调试预览产生的临时记录不会进入这里。</p>
              </div>
              ${canOptimize ? `<button class="btn btn-soft" data-action="generateOptimize" ${records.length ? '' : 'disabled'}>${icon('spark')}Skill 优化</button>` : ''}
            </div>
            <div class="metric-grid">
              <div class="metric"><strong>${stats.total}</strong><span>最近调用记录</span><small>按时间倒序展示，10 条/页。</small></div>
              <div class="metric"><strong>${stats.successRate}</strong><span>平均调用成功率</span><small>成功率 = 成功调用数 / 已完成调用数；已完成 = 成功 + 失败。</small></div>
              <div class="metric"><strong>${stats.avg}${stats.avg === '-' ? '' : 's'}</strong><span>平均时长</span><small>平均时长 = 已完成调用总耗时 / 已完成调用数。</small></div>
            </div>
          </div>
          <div class="experience-body">
            <section class="experience-list">
              ${records.length ? `
                <div class="call-record-table-wrap">
                  <table class="table call-record-table">
                    <thead>
                      <tr>
                        <th>调用 Skill 版本</th>
                        <th>UserID</th>
                        <th>SessionID</th>
                        <th>时间</th>
                        <th>耗时</th>
                        <th>状态</th>
                        <th>上下文</th>
                      </tr>
                    </thead>
                    <tbody>
                      ${pageRecords.map(renderCallRecordRow).join('')}
                    </tbody>
                  </table>
                </div>
                <div class="row mt-16" style="justify-content: space-between;">
                  <span class="muted">第 ${state.experiencePage} / ${totalPages} 页，每页 10 条</span>
                  <div class="inline">
                    <button class="btn" data-action="prevExperiencePage" ${state.experiencePage <= 1 ? 'disabled' : ''}>上一页</button>
                    <button class="btn" data-action="nextExperiencePage" ${state.experiencePage >= totalPages ? 'disabled' : ''}>下一页</button>
                  </div>
                </div>
              ` : `
                <div class="empty">
                  ${icon('history')}
                  <h3>暂无调用记录</h3>
                  <p>暂无线上调用记录，Skill 优化不可用。</p>
                </div>
              `}
            </section>
          </div>
        </aside>
      `;
    }

    function renderCallRecordRow(record) {
      return `
        <tr>
          <td>${escapeHtml(record.version)}</td>
          <td>${escapeHtml(record.userId || '-')}</td>
          <td>${escapeHtml(record.sessionId || record.id)}</td>
          <td>${escapeHtml(record.time)}</td>
          <td>${escapeHtml(record.duration)}s</td>
          <td><span class="badge ${record.status === 'success' ? 'green' : record.status === 'failed' ? 'red' : ''}">${record.status === 'success' ? '成功' : record.status === 'failed' ? '失败' : '取消'}</span></td>
          <td><button class="btn btn-soft" data-action="openSession" data-id="${escapeHtml(record.id)}">${icon('eye')}查看上下文</button></td>
        </tr>
      `;
    }

    function renderDebugDrawer(skill) {
      return `
        <div class="debug-scrim" data-action="closeDebugPanel"></div>
        <aside class="debug-drawer" role="complementary" aria-label="调试预览抽屉">
          ${renderDebugPanel(skill, { drawer: true })}
        </aside>
      `;
    }

    function renderDebugPanel(skill, options = {}) {
      const messages = skill.debugMessages || [];
      return `
        <aside class="debug-panel" role="complementary" aria-label="调试预览">
          <div class="debug-head">

        rollbackConfirm: renderRollbackConfirmModal,
        session: renderSessionModal,

    function renderDiffModal() {
      const skill = getSkill();
      ensureVersionData(skill);
      const baseVersion = skill.versions.find(item => item.version === state.compareVersionA);
      const targetVersion = skill.versions.find(item => item.version === state.compareVersionB);
      if (!baseVersion || !targetVersion || baseVersion.version === targetVersion.version) {
        return `
          <div class="modal-backdrop">
            <section class="modal small">
              <div class="modal-head">
                <h2>版本对比</h2>
                <button class="back-btn" data-action="closeModal">${icon('close')}</button>
              </div>
              <div class="modal-body">
                <div class="hint">${icon('alert')} 请先在版本管理中选择两个不同版本，再查看差异。</div>
              </div>
              <div class="modal-foot">
                <button class="btn btn-primary" data-action="openVersion">去选择版本</button>
              </div>
            </section>
          </div>
        `;
      }
      const baseFiles = baseVersion.files || {};
      const targetFiles = targetVersion.files || {};
      const fileRows = diffFileTree(baseFiles, targetFiles);
      const previous = baseFiles['SKILL.md'] || '';
      const current = targetFiles['SKILL.md'] || '';
      return `
        <div class="modal-backdrop">
          <section class="modal wide">
            <div class="modal-head">
              <div>
                <h2>版本对比</h2>
                <p class="muted mt-12">${escapeHtml(targetVersion.version)} 相对 ${escapeHtml(baseVersion.version)} 的变化；先展示文件树，再展示 SKILL.md 差异。</p>

                    <tr>

                      <td><span class="badge ${row.type === '新增' ? 'green' : row.type === '删除' ? 'red' : row.type === '修改' ? 'orange' : ''}">${row.type}</span></td>

                  <div class="diff-title">${escapeHtml(baseVersion.version)} 基准版本</div>
                  <pre class="diff">${renderDiff(previous, current, 'old')}</pre>
                </div>
                <div class="diff-pane">
                  <div class="diff-title">${escapeHtml(targetVersion.version)} 目标版本</div>
                  <pre class="diff">${renderDiff(previous, current, 'new')}</pre>
                </div>
              </div>
            </div>
            <div class="modal-foot">
              <button class="btn btn-primary" data-action="closeModal">我知道了</button>
            </div>
          </section>
        </div>

    function renderVersionModal() {

      const optionList = (selected) => skill.versions.map(item => `
        <option value="${escapeHtml(item.version)}" ${item.version === selected ? 'selected' : ''}>${escapeHtml(item.version)} ${item.status ? `· ${escapeHtml(item.status)}` : ''} · ${escapeHtml(item.time)}</option>

              <div class="version-compare-card">

            </div>

      const skill = getSkill();
      ensureVersionData(skill);
      const action = state.versionAction || 'save';
      const source = action === 'copy' ? skill.versions.find(item => item.version === state.versionSource) : null;
      const isPublish = action === 'publish';
      const isCopy = action === 'copy';
      const title = isCopy ? `复制 ${source?.version || ''} 为新版本` : isPublish ? '保存并发布' : '仅保存';
      const next = nextVersion(maxVersion(skill));
      const current = skill.versions.find(item => item.version === skill.version);
      const willOverwriteDraft = !isPublish && !isCopy && current?.status === '草稿';
      return `
        <div class="modal-backdrop">
          <section class="modal small">
            <div class="modal-head">
              <div>
                <h2>${title}</h2>
                <p class="muted mt-12">${isPublish ? '发布一定创建新版本，发布后成为唯一发布态。' : isCopy ? '复制会基于所选版本文件创建一个新的草稿版本。' : willOverwriteDraft ? '当前基于草稿编辑，仅保存会覆盖当前草稿。' : '当前基于已保存版本编辑，仅保存会另存为新的草稿版本。'}</p>

            </div>

        </div>

    function renderDiff(oldText, newText, side) {
      const oldLines = oldText.split('\n');
      const newLines = newText.split('\n');
      const max = Math.max(oldLines.length, newLines.length);
      let html = '';
      for (let i = 0; i < max; i++) {
        const oldLine = oldLines[i] || '';
        const newLine = newLines[i] || '';
        if (oldLine === newLine) {
          html += `<span class="line-same">${escapeHtml(side === 'old' ? oldLine : newLine) || ' '}</span>`;
        } else if (side === 'old') {
          html += `<span class="line-del">- ${escapeHtml(oldLine) || ' '}</span>`;
        } else {
          html += `<span class="line-add">+ ${escapeHtml(newLine) || ' '}</span>`;
        }
      }
      return html;
    }

    function cloneFiles(files) {
      return JSON.parse(JSON.stringify(files || {}));
    }

    function stripVersionPrefix(version) {
      return String(version || '').replace(/^v/i, '');
    }

    function parseVersion(version) {
      const normalized = stripVersionPrefix(version).trim();
      const match = normalized.match(/^(\d+)\.(\d+)$/);
      if (!match) return null;
      return { label: `v${Number(match[1])}.${Number(match[2])}`, major: Number(match[1]), minor: Number(match[2]) };
    }

    function compareVersion(a, b) {
      const va = parseVersion(a);
      const vb = parseVersion(b);
      if (!va || !vb) return 0;
      if (va.major !== vb.major) return va.major - vb.major;
      return va.minor - vb.minor;
    }

    function maxVersion(skill) {
      ensureVersionData(skill);
      return skill.versions.reduce((max, item) => compareVersion(item.version, max) > 0 ? item.version : max, skill.version || 'v0.0');
    }

    function diffFileTree(oldFiles, newFiles) {
      const names = Array.from(new Set([...Object.keys(oldFiles || {}), ...Object.keys(newFiles || {})])).sort();
      return names.map(file => {
        const inOld = Object.prototype.hasOwnProperty.call(oldFiles || {}, file);
        const inNew = Object.prototype.hasOwnProperty.call(newFiles || {}, file);
        let type = '无变化';
        if (!inOld && inNew) type = '新增';
        else if (inOld && !inNew) type = '删除';
        else if ((oldFiles || {})[file] !== (newFiles || {})[file]) type = '修改';
        return { file, inOld, inNew, type };
      });
    }

    function ensureVersionData(skill) {
      if (!Array.isArray(skill.versions)) skill.versions = [];
      if (!skill.versions.length) {
        skill.versions.unshift({
          version: skill.version || 'v0.1',
          time: skill.updated || nowText(),
          desc: '初始化版本',
          creator: skill.owner || 'MarketingAgent',
          status: skill.status === 'published' ? '已发布' : '草稿',
          files: cloneFiles(skill.files)
        });
      }
      skill.versions.forEach((item, index) => {
        if (!item.desc) item.desc = item.status === '已发布' ? '发布版本' : item.status === '草稿' ? '草稿保存' : '历史版本';
        if (!item.creator) item.creator = skill.owner || 'MarketingAgent';
        if (!item.files) {
          const files = cloneFiles(skill.files);
          if (index > 0 && files['SKILL.md']) {
            files['SKILL.md'] = files['SKILL.md'].replace(/version: .+\n/, `version: ${item.version}\n`);
          }
          item.files = files;
        }
        if (item.status && item.status !== '已发布' && item.status !== '草稿') item.status = '';
      });
      skill.versions.sort((a, b) => compareVersion(b.version, a.version));
    }

    function syncSkillMarkdown(skill) {
      const raw = skill.files['SKILL.md'] || '';
      const body = raw.startsWith('---\n') ? raw.replace(/^---\n[\s\S]*?\n---\n*/, '') : raw;
      const fallback = `# ${skill.name}\n\n## 使用说明\n请补充 Skill 的适用场景、输入格式、输出要求和失败处理策略。\n`;
      skill.files['SKILL.md'] = `---\nname: ${skill.name}\ndescription: ${skill.desc}\nversion: ${skill.version}\n---\n\n${body.trim() || fallback}`;
    }

    function saveVersionSnapshot(skill, options) {
      ensureVersionData(skill);
      const { version, desc, status, overwrite, sourceFiles } = options;
      const targetFiles = cloneFiles(sourceFiles || skill.files);
      skill.version = version;
      skill.files = targetFiles;
      syncSkillMarkdown(skill);
      const snapshot = {
        version,
        time: nowText(),
        desc: desc || (status === '已发布' ? '发布版本' : '草稿保存'),
        creator: skill.owner || 'MarketingAgent',
        status,
        files: cloneFiles(skill.files)
      };
      if (status === '已发布') {
        skill.versions.forEach(item => { item.status = ''; });
      }
      const existingIndex = skill.versions.findIndex(item => item.version === version);
      if (overwrite && existingIndex >= 0) {
        skill.versions[existingIndex] = { ...skill.versions[existingIndex], ...snapshot };
      } else {
        skill.versions.unshift(snapshot);
      }
      skill.versions.sort((a, b) => compareVersion(b.version, a.version));
      skill.status = status === '已发布' ? 'published' : 'draft';
      skill.enabled = status === '已发布';
      skill.updated = nowText();
      skill.dirty = false;
      skill.aiUndoSnapshot = null;
      state.selectedFile = 'SKILL.md';
    }

    function commitVersionForm(skill) {
      ensureVersionData(skill);
      const action = state.versionAction || 'save';
      const desc = document.getElementById('versionDescInput')?.value.trim() || '';
      const status = action === 'publish' ? '已发布' : '草稿';

      const source = action === 'copy' ? skill.versions.find(item => item.version === state.versionSource) : null;
      if (action === 'save') {
        const current = skill.versions.find(item => item.version === skill.version);
        const shouldOverwriteDraft = current?.status === '草稿';
        const version = shouldOverwriteDraft ? skill.version : nextVersion(maxVersion(skill));
        saveVersionSnapshot(skill, {
          version,
          desc,
          status,
          overwrite: shouldOverwriteDraft
        });
        return true;
      }

      saveVersionSnapshot(skill, {
        version: nextVersion(maxVersion(skill)),
        desc,
        status,
        overwrite: false,
        sourceFiles: source?.files
      });
      return true;
    }

    function rollbackToVersion(skill, version) {
      ensureVersionData(skill);
      const index = skill.versions.findIndex(item => item.version === version);
      if (index < 0) {
        toast('未找到目标版本。');
        return false;
      }
      const target = skill.versions[index];
      skill.versions = skill.versions.slice(index);
      skill.version = target.version;
      skill.files = cloneFiles(target.files);
      skill.status = target.status === '已发布' ? 'published' : 'draft';
      skill.enabled = target.status === '已发布';
      skill.updated = nowText();
      skill.dirty = false;
      state.selectedFile = 'SKILL.md';
      return true;
    }

    function nextVersion(version) {
      const match = String(version).match(/v(\d+)\.(\d+)/);
      if (!match) return 'v1.1';
      return `v${match[1]}.${Number(match[2]) + 1}`;
    }

    function toast(message) {
      const root = document.getElementById('toast-root');
      const node = document.createElement('div');
      node.className = 'toast';
      node.textContent = message;
      root.appendChild(node);
      setTimeout(() => node.remove(), 3600);
    }

    function nowText() {
      return '2026-06-04 ' + new Date().toTimeString().slice(0, 8);
    }

    function markDirty(skill) {
      skill.dirty = true;
      document.querySelectorAll('[data-dirty-indicator]').forEach(node => {
        node.className = 'badge orange';
        node.textContent = '未保存变更';
      });
      document.querySelectorAll('[data-debug-version]').forEach(node => {
        node.className = 'badge orange';
        node.textContent = '临时草稿调试';
      });
    }

    function createDraftSkill(fromPrompt) {

      const desc = fromPrompt
        ? '基于自然语言需求生成：支持上传研报 PDF，提取公司、评级、目标价、关键风险和结构化摘要。'

      const files = fromPrompt ? {
        'SKILL.md': `---\nname: ${name}\ndescription: ${desc}\n---\n\n# ${name}\n\n## 适用场景\n用于证券研报、公告和分析材料的结构化解析。\n\n## 输入\n- PDF 文件\n- 可选：图片截图\n\n## 输出\n- company\n- rating\n- target_price\n- risks\n- evidence_pages\n`,
        'schema.md': '# Output Schema\n\n输出 JSON 字段：company、rating、target_price、risks、evidence_pages。\n'
      } : { 'SKILL.md': '' };
      const skill = {

        status: 'draft',
        enabled: false,
        updated: nowText(),

        version: 'v0.1',
        tags: fromPrompt ? ['研报解析', 'PDF', '结构化抽取'] : [],
        supportedTypes: fromPrompt ? ['text', 'pdf', 'image'] : ['text'],
        modelVision: !!fromPrompt,
        thinkingOn: state.createThinkingOn,
        files,
        versions: [{ version: 'v0.1', time: nowText(), status: '草稿' }],
        records: [],
        dirty: !!fromPrompt,
        aiUndoSnapshot: fromPrompt ? {
          name: '未命名 Skill',
          desc: '请填写 Skill 描述。',
          files: { 'SKILL.md': '' },
          selectedFile: 'SKILL.md'
        } : null
      };
      skills.unshift(skill);
      state.selectedSkillId = id;
      state.selectedFile = 'SKILL.md';
      state.route = 'edit';
      state.editTab = 'edit';
      state.detailMode = 'edit';
      state.debugOpen = false;
      return skill;
    }

    function applyOptimizedFiles(skill) {
      state.rollbackSnapshot = {
        version: skill.version,
        files: JSON.parse(JSON.stringify(skill.files)),
        name: skill.name,
        desc: skill.desc
      };
      const oldVersion = skill.version;
      skill.version = nextVersion(skill.version);
      skill.status = 'draft';
      skill.updated = nowText();
      skill.files['SKILL.md'] = (skill.files['SKILL.md'] || '') + '\n## 调试优化建议\n- 对扫描型 PDF：先执行 OCR，输出页级置信度；低于阈值时返回可重试原因。\n- 对表格密集页：保留跨页合并线索、表头和页码引用。\n';
      skill.files['reference.md'] = (skill.files['reference.md'] || '# Reference\n') + '\n## 跨页表格规则\n1. 使用页码 + 表头相似度识别跨页表格。\n2. 合并后保留原始页码映射。\n';
      skill.files['scripts/parse_pdf.py'] = (skill.files['scripts/parse_pdf.py'] || '') + '\n\ndef detect_page_type(page):\n    return "scan" if page.get("image_ratio", 0) > 0.65 else "text"\n';
      skill.versions.unshift({ version: skill.version, time: nowText(), status: '草稿' });
      skill.dirty = false;
      state.selectedFile = 'SKILL.md';
      state.editTab = 'edit';
      state.detailMode = 'edit';
      state.debugOpen = false;
      toast(`已基于 ${oldVersion} 创建 ${skill.version} 草稿，可继续编辑或回滚。`);
    }
